<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome - AI Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #2e1065, #6b21a8);
            color: white;
        }

        .welcome-box {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
        }

        h1 span {
            color: #d8b4fe;
        }

        p {
            font-size: 19px;
            line-height: 1.6;
            color: #f3e8ff;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 35px;
            background: white;
            color: #4c1d95;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #f3e8ff;
        }
    </style>
</head>

<body>

    <div class="welcome-box">

        <div class="logo">🚀</div>

        <h1>
            Welcome to <span>AI Studio</span>
        </h1>

        <p>
            Your personal AI workspace for creating,
            writing and chatting with powerful AI tools.
        </p>

        <a class="btn" href="login.html">
            Get Started →
        </a>

    </div>

</body>
</html>

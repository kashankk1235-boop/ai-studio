<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Studio - Content Writer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222;
            min-height: 100vh;
        }

        /* NAVBAR */

        nav {
            background: #2e1065;
            padding: 18px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: #f3e8ff;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #d8b4fe;
        }

        /* MAIN */

        .container {
            max-width: 850px;
            margin: 55px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #e9d5ff;
            box-shadow: 0 12px 40px rgba(46, 16, 101, 0.12);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #2e1065;
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            color: #777;
            margin: 12px 0 30px;
        }

        /* TEXTAREA */

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            margin: 5px 0 15px;
            border: 1px solid #d8b4fe;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #7e22ce;
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.10);
        }

        /* BUTTON */

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #4c1d95;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #6b21a8;
            transform: translateY(-2px);
        }

        /* RESULT */

        .result-heading {
            text-align: left;
            color: #4c1d95;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        #result {
            margin-top: 10px;
            padding: 18px;
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            border-radius: 12px;
            text-align: left;
            white-space: pre-wrap;
            min-height: 100px;
            color: #333;
            line-height: 1.6;
        }

        .back {
            background: #f3e8ff;
            color: #4c1d95;
        }

        .back:hover {
            background: #e9d5ff;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .container {
                margin: 25px auto;
            }

            .box {
                padding: 25px;
            }

            h1 {
                font-size: 27px;
            }

            nav {
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🚀 AI Studio
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="image.html">Image</a>
            <a href="chat.html">Chatbot</a>
        </div>

    </nav>


    <!-- CONTENT WRITER -->

    <div class="container">

        <div class="box">

            <div class="icon">
                ✍️
            </div>

            <h1>
                AI Content Writer
            </h1>

            <p class="subtitle">
                Give AI a topic and let it create content for you.
            </p>


            <textarea
                id="prompt"
                placeholder="Example: Write a short paragraph about friendship..."
            ></textarea>


            <button onclick="generateContent()">
                ✨ Generate Content
            </button>


            <h3 class="result-heading">
                Generated Content
            </h3>


            <div id="result">
                Your generated content will appear here.
            </div>


            <button
                class="back"
                onclick="window.location.href='index.html'"
            >
                ← Back to Dashboard
            </button>

        </div>

    </div>


    <script>

        async function generateContent() {

            const prompt =
                document
                .getElementById("prompt")
                .value
                .trim();

            const result =
                document.getElementById("result");


            if (prompt === "") {

                alert("Please enter a topic");

                return;
            }


            result.innerText =
                "Generating... ⏳";


            try {

                const response =
                    await fetch(
                        "http://localhost:3000/generate-text",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                prompt: prompt
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    result.innerText =
                        "Error: " +
                        JSON.stringify(data);

                    return;
                }


                result.innerText =
                    data.text ||
                    "No content received.";


            } catch (error) {

                console.error(error);

                result.innerText =
                    "Cannot connect to server!";

            }

        }

    </script>

</body>

</html>

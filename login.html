<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Studio - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #e9d5ff;
            box-shadow: 0 10px 35px rgba(46, 16, 101, 0.15);
        }

        h1 {
            color: #2e1065;
            margin-bottom: 8px;
        }

        h2 {
            color: #4c1d95;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #d8b4fe;
            border-radius: 9px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #7e22ce;
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.10);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #4c1d95;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #6b21a8;
        }

        a {
            color: #6b21a8;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo {
            font-size: 45px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🚀</div>

        <h1>AI Studio</h1>

        <h2>Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="login()">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>


    <script>

        function login() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("Please enter email and password.");

                return;
            }


            const savedUser =
                localStorage.getItem("aiStudioUser");


            if (!savedUser) {

                alert("No account found. Please register first.");

                return;
            }


            const user =
                JSON.parse(savedUser);


            if (
                email === user.email &&
                password === user.password
            ) {

                alert("Login Successful! 🎉");

                window.location.href = "index.html";

            } else {

                alert("Wrong Email or Password!");

            }

        }

    </script>

</body>

</html>

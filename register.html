<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Studio - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid #e9d5ff;
            box-shadow: 0 10px 35px rgba(46, 16, 101, 0.15);
        }

        .logo {
            font-size: 45px;
        }

        h1 {
            color: #2e1065;
            margin: 8px 0;
        }

        h2 {
            color: #4c1d95;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #d8b4fe;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #7e22ce;
            box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.10);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #4c1d95;
            color: white;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #6b21a8;
        }

        a {
            display: block;
            margin-top: 18px;
            color: #6b21a8;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🚀</div>

        <h1>AI Studio</h1>

        <h2>Create Account</h2>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="register()">
            Register
        </button>

        <a href="login.html">
            Already have an account? Login
        </a>

    </div>


    <script>

        function register() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("Please fill all fields");

                return;
            }


            const user = {
                email: email,
                password: password
            };


            localStorage.setItem(
                "aiStudioUser",
                JSON.stringify(user)
            );


            alert("Registration successful! 🎉");


            window.location.href = "login.html";

        }

    </script>

</body>

</html>
